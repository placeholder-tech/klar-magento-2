name: Trivy Security Scan
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

# The branch ruleset on main requires the central workflow
# placeholder-tech/github-workflows/.github/workflows/trivy.yaml@master.
# Required workflows are matched by file identity, so a local copy cannot
# satisfy the check; this caller runs the central workflow via workflow_call,
# which does.
jobs:
  trivy:
    name: Trivy Security Scan
    permissions:
      contents: read
      pull-requests: write
    uses: placeholder-tech/github-workflows/.github/workflows/trivy.yaml@master
